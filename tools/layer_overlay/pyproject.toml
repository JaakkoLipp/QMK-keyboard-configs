[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sofle-layer-overlay"
version = "1.0.0"
description = "On-screen layer overlay and Claude Code status bridge for the Finnish Sofle keymap"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = [
    # PySide6 6.12.0 over-releases None on every void call, which aborts
    # Python < 3.12 (None is immortal from 3.12 on, so it is harmless there).
    "PySide6>=6.6,!=6.12.0; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "hidapi>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sofle-overlay = "layer_overlay.__main__:main"

[project.gui-scripts]
sofle-overlay-gui = "layer_overlay.__main__:main"

[tool.setuptools.packages.find]
include = ["layer_overlay*"]

[tool.setuptools.package-data]
layer_overlay = ["data/*.json"]
